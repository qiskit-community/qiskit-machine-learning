---
upgrade:
  - |
    Removed the deprecated ``num_qubits`` argument and automatic qubit alignment
    (padding or resizing) from
    :func:`~qiskit_machine_learning.utils.derive_num_qubits_feature_map_ansatz`,
    :func:`~qiskit_machine_learning.circuit.library.qnn_circuit`,
    :class:`~qiskit_machine_learning.algorithms.classifiers.VQC`, and
    :class:`~qiskit_machine_learning.algorithms.regressors.VQR`. Construct
    ``feature_map`` and ``ansatz`` with the same number of qubits before
    passing them to these APIs. See ``docs/migration/03_migration_guide_0.10.rst``.
  - |
    Quantum kernels no longer attempt to resize the feature map when the input
    feature dimension does not match. Construct the feature map with the
    expected feature dimension before calling :meth:`~.BaseKernel.evaluate`.
fixes:
  - |
    Removes the deprecated qubit auto-alignment feature announced in version
    ``0.9.1``. See
    `#1024 <https://github.com/qiskit-community/qiskit-machine-learning/issues/1024>`__.
